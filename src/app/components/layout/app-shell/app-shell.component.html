<div class="min-h-screen bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
  @if (!desktopMenuCollapsed) { <app-sidebar class="fixed inset-y-0 left-0 z-40 hidden w-64 lg:block" /> }
  @if (mobileMenuOpen) { <div class="fixed inset-0 z-50 lg:hidden"><button type="button" class="absolute inset-0 bg-black/45" aria-label="Cerrar menú" (click)="closeMenu()"></button><app-sidebar class="absolute inset-y-0 left-0 w-64 shadow-xl" (navigate)="closeMenu()" /></div> }
  <div [class]="desktopMenuCollapsed ? 'min-w-0' : 'min-w-0 lg:pl-64'"><app-topbar (openMenu)="toggleMenu()" (collapseMenu)="toggleDesktopMenu()" /><main class="min-w-0 px-4 py-5 sm:px-6 lg:px-8"><app-breadcrumb /><router-outlet /></main></div>
</div>
