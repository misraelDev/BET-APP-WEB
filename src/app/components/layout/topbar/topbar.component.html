<header class="flex h-16 items-center justify-between border-b border-gray-200 bg-white px-4 sm:px-6 dark:border-gray-800 dark:bg-gray-950">
  <div class="flex items-center gap-3">
    <button type="button" class="grid size-9 place-items-center border border-gray-200 text-gray-600 hover:bg-gray-50 lg:hidden dark:border-gray-700 dark:text-gray-300" title="Abrir menú" aria-label="Abrir menú" (click)="openMenu.emit()"><svg lucideMenu size="18" aria-hidden="true"></svg></button>
    <button type="button" class="hidden size-9 place-items-center border border-gray-200 text-gray-600 hover:bg-gray-50 lg:grid dark:border-gray-700 dark:text-gray-300" title="Contraer menú" aria-label="Contraer o expandir menú" (click)="collapseMenu.emit()"><svg lucidePanelLeftClose size="18" aria-hidden="true"></svg></button>
    <span class="hidden text-xs font-medium text-gray-500 lg:block dark:text-gray-400">Centro de análisis deportivo</span>
  </div>
  <div class="flex items-center gap-2">
    <button type="button" class="grid size-9 place-items-center border border-gray-200 text-base text-gray-600 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300" [title]="darkMode() ? 'Modo claro' : 'Modo oscuro'" (click)="toggleTheme()">{{ darkMode() ? '☀' : '☾' }}</button>
    <app-profile-menu />
  </div>
</header>
