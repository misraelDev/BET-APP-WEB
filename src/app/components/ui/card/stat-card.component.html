<article class="flex h-full min-h-48 flex-col overflow-hidden rounded-lg border border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-950">
  <div class="flex flex-col gap-3 p-5">
    <p class="m-0 text-sm text-gray-500 dark:text-gray-400">{{ stat().title }}</p>
    <div class="flex items-center gap-2">
      <strong class="text-2xl font-bold text-gray-950 dark:text-white">{{ stat().value }}</strong>
      <span class="inline-flex items-center gap-1 rounded border px-1.5 py-0.5 text-xs font-medium" [class.border-sky-200]="stat().trend === 'up'" [class.bg-sky-50]="stat().trend === 'up'" [class.text-sky-700]="stat().trend === 'up'" [class.border-amber-200]="stat().trend === 'down'" [class.bg-amber-50]="stat().trend === 'down'" [class.text-amber-700]="stat().trend === 'down'">
        @if (stat().trend === 'up') { <svg lucideArrowUpRight size="13" aria-hidden="true"></svg> }
        @else { <svg lucideArrowDownRight size="13" aria-hidden="true"></svg> }
        {{ stat().percentage }}
      </span>
    </div>
  </div>
  <div class="relative mt-auto h-20 w-full overflow-hidden" [style.color]="stat().color" (mousemove)="move($event)" (mouseleave)="hoverIndex.set(null)">
    @if (stat().chartType === 'bar') {
      <div class="flex h-full items-end gap-1 px-4">
        @for (height of bars(); track $index) { <span class="min-w-1 flex-1 rounded-t-sm bg-current opacity-75" [class.opacity-100]="hoverIndex() === $index" [style.height.%]="height"></span> }
      </div>
    } @else {
      <svg class="h-full w-full" viewBox="0 0 200 60" preserveAspectRatio="none" role="img" [attr.aria-label]="'Tendencia de ' + stat().title">
        <polygon [attr.points]="areaPoints()" fill="currentColor" opacity="0.12"></polygon>
        <polyline [attr.points]="linePoints()" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>
      </svg>
    }
    @if (tooltip(); as detail) {
      <div class="pointer-events-none absolute right-2 top-1 z-10 max-w-48 border border-gray-200 bg-white px-2 py-1 text-[10px] leading-4 text-gray-700 shadow-sm dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200">
        <strong class="block truncate font-semibold">{{ detail.label }}</strong>
        <span>{{ detail.value }}</span>
      </div>
    }
  </div>
</article>
