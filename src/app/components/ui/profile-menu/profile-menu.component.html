<div class="relative">
  <button type="button" class="flex h-9 items-center gap-2 border border-gray-200 bg-white px-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-950 dark:text-gray-200 dark:hover:bg-gray-900" aria-label="Abrir menú de perfil" [attr.aria-expanded]="open()" (click)="toggle($event)">
    <img src="assets/images/user/avatar-2.jpg" alt="Foto de perfil" class="size-7 rounded-full object-cover" />
    <span class="hidden sm:inline">John Doe</span>
    <svg lucideChevronDown size="14" class="hidden text-gray-400 sm:block" aria-hidden="true"></svg>
  </button>

  @if (open()) {
    <div class="absolute right-0 top-11 z-50 w-56 border border-gray-200 bg-white py-2 shadow-lg dark:border-gray-700 dark:bg-gray-950" (click)="$event.stopPropagation()">
      <div class="flex items-center gap-3 border-b border-gray-100 px-4 pb-3 pt-1 dark:border-gray-800">
        <img src="assets/images/user/avatar-2.jpg" alt="Foto de perfil" class="size-9 rounded-full object-cover" />
        <div class="min-w-0"><strong class="block truncate text-sm text-gray-900 dark:text-white">John Doe</strong><small class="text-gray-500 dark:text-gray-400">Usuario</small></div>
      </div>
      <button type="button" class="flex w-full items-center gap-3 px-4 py-2.5 text-left text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-900"><svg lucideUser size="16" aria-hidden="true"></svg>Perfil</button>
      <button type="button" class="flex w-full items-center gap-3 px-4 py-2.5 text-left text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-900"><svg lucideSettings size="16" aria-hidden="true"></svg>Configuración</button>
      <button type="button" class="flex w-full items-center gap-3 border-t border-gray-100 px-4 py-2.5 text-left text-sm text-red-600 hover:bg-red-50 dark:border-gray-800 dark:hover:bg-red-950/30"><svg lucideLogOut size="16" aria-hidden="true"></svg>Cerrar sesión</button>
    </div>
  }
</div>
