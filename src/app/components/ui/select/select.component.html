<div class="relative" [class.max-w-24]="compact()">
  <select
    class="sports-input appearance-none pr-9"
    [class.max-w-24]="compact()"
    [id]="id()"
    [name]="name()"
    [attr.aria-label]="ariaLabel()"
    [value]="value()"
    [disabled]="disabled()"
    (change)="change($event)"
  >
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
    }
  </select>
  <svg lucideChevronDown class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-400" size="15" aria-hidden="true"></svg>
</div>
