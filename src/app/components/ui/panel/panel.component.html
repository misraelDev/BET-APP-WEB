<section class="border border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-950" [ngClass]="cardClass()">
  @if (showHeader()) {
    <header class="flex min-h-14 items-center justify-between border-b border-gray-200 px-5 py-3 dark:border-gray-800" [ngClass]="headerClass()">
      <div><h2 class="m-0 text-sm font-semibold text-gray-900 dark:text-gray-100">{{ cardTitle() }}</h2><ng-container *ngTemplateOutlet="headerTitleTemplate" /></div>
      <ng-container *ngTemplateOutlet="headerOptionsTemplate" />
    </header>
  }
  @if (showContent()) { <div [ngClass]="blockClass()" [style.padding.px]="padding()"><ng-content /></div> }
</section>
