<span class="mt-2 inline-flex items-center gap-1.5 border px-2 py-1 text-[10px] font-semibold" [class.border-emerald-200]="normalizedOutcome() === 'won'" [class.bg-emerald-50]="normalizedOutcome() === 'won'" [class.text-emerald-700]="normalizedOutcome() === 'won'" [class.border-red-200]="normalizedOutcome() === 'lost'" [class.bg-red-50]="normalizedOutcome() === 'lost'" [class.text-red-700]="normalizedOutcome() === 'lost'" [class.border-gray-200]="normalizedOutcome() === 'pending' || normalizedOutcome() === 'push'" [class.bg-gray-50]="normalizedOutcome() === 'pending' || normalizedOutcome() === 'push'" [class.text-gray-600]="normalizedOutcome() === 'pending' || normalizedOutcome() === 'push'">@switch (normalizedOutcome()) { @case ('won') { <svg lucideCheck size="12" aria-hidden="true"></svg> } @case ('lost') { <svg lucideX size="12" aria-hidden="true"></svg> } @case ('push') { <svg lucideMinus size="12" aria-hidden="true"></svg> } @default { <svg lucideClock3 size="12" aria-hidden="true"></svg> } }{{ label() }}</span>
